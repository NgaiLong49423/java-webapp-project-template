name: Feature Request
description: Đề xuất hoặc ghi nhận yêu cầu chức năng mới (FR - Functional Requirement)
title: "feat: "
labels: ["🚀 Feature"]
body:
  - type: input
    id: feature_name
    attributes:
      label: "1. Tên chức năng"
      description: "Ghi tên chức năng cần thêm hoặc cải thiện."
      placeholder: "Ví dụ: Cập nhật hồ sơ, xuất báo cáo..."
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "2. Mô tả chức năng"
      description: "Mô tả chức năng này dùng để làm gì. (Feature là tính năng. Functional Requirement (FR) là yêu cầu chức năng mà hệ thống cần thực hiện)."
      placeholder: "Mô tả chi tiết chức năng..."
    validations:
      required: true
  - type: input
    id: affected_roles
    attributes:
      label: "3. Người dùng hoặc vai trò bị ảnh hưởng (nếu có)"
      description: "Ghi các nhóm người dùng liên quan theo dự án; không cần điền nếu không áp dụng."
      placeholder: "Vai trò hoặc nhóm người dùng..."
    validations:
      required: false
  - type: textarea
    id: rationale
    attributes:
      label: "4. Lý do cần chức năng"
      description: "Giải thích vì sao chức năng này cần thiết cho dự án/người dùng."
      placeholder: "Lý do..."
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: "5. Luồng hoạt động mong muốn"
      description: "Mô tả các bước hoạt động chính của chức năng."
      placeholder: |
        1. Người dùng click vào...
        2. Hệ thống xử lý...
        3. Kết quả trả về...
    validations:
      required: true
  - type: textarea
    id: expected_result
    attributes:
      label: "6. Kết quả mong muốn"
      description: "Mô tả kết quả sau khi chức năng được hoàn thành."
      placeholder: "Mô tả kết quả quan sát được sau khi chức năng hoàn thành."
    validations:
      required: true
  - type: textarea
    id: definition_of_done
    attributes:
      label: "7. Tiêu chí hoàn thành"
      description: "Ghi các điều kiện để biết chức năng này đã hoàn thành."
      placeholder: |
        - [ ] Tích hợp thành công nút đăng nhập.
        - [ ] Kiểm thử luồng chạy không bị lỗi.
        - [ ] Ghi log chi tiết khi đăng nhập.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: "8. Tài liệu hoặc thiết kế liên quan"
      description: "Thêm link yêu cầu, tài liệu hoặc thiết kế liên quan; ghi 'Không có' nếu chưa có."
      placeholder: "Link tài liệu hoặc thiết kế liên quan..."
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: "9. Mức độ ưu tiên"
      description: "Chọn mức độ ưu tiên cho yêu cầu chức năng này."
      options:
        - "Thấp (Low)"
        - "Trung bình (Medium)"
        - "Cao (High)"
        - "Bắt buộc (Critical)"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: "10. Ghi chú thêm"
      description: "Ghi thêm thông tin khác nếu cần."
      placeholder: "Nhập ghi chú thêm..."
    validations:
      required: false
